
[functions.ai-scheduler]
enabled = true
verify_jwt = true
import_map = "./functions/ai-scheduler/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/ai-scheduler/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/ai-scheduler/*.html" ]

[functions.meta-forms-sync]
enabled = true
# Disparada pelo pg_cron (sem JWT), igual à whatsapp-sync-status.
verify_jwt = false
entrypoint = "./functions/meta-forms-sync/index.ts"

[functions.forms-welcome-followup]
enabled = true
# Disparada por pg_net a partir de process_forms_followup() (sem JWT).
verify_jwt = false
entrypoint = "./functions/forms-welcome-followup/index.ts"

[functions.reengagement-followup]
enabled = true
# Disparada por pg_net a partir de process_reengagement_followup() (sem JWT).
verify_jwt = false
entrypoint = "./functions/reengagement-followup/index.ts"

[functions.meta-cloud-api]
enabled = true
# Chamada pelo frontend (functions.invoke manda o JWT do usuário).
verify_jwt = true
entrypoint = "./functions/meta-cloud-api/index.ts"

[functions.meta-cloud-webhook]
enabled = true
# Callback da WhatsApp Cloud API oficial — a Meta chama sem Authorization.
verify_jwt = false
entrypoint = "./functions/meta-cloud-webhook/index.ts"

[functions.conv-ai-analyst]
enabled = true
# Disparada pelo pg_cron via system_http_post (sem JWT).
verify_jwt = false
entrypoint = "./functions/conv-ai-analyst/index.ts"

[functions.conv-ai-learn]
enabled = true
# Disparada pelo pg_cron via system_http_post (sem JWT).
verify_jwt = false
entrypoint = "./functions/conv-ai-learn/index.ts"

[functions.chat-send]
enabled = true
# Chamada pelo frontend (functions.invoke manda o JWT do usuário) e a função ainda valida o uid
# por dentro. Estava fora deste arquivo e o valor real em produção era true — registrado aqui para
# um deploy futuro não derrubar o envio manual sem querer.
verify_jwt = true
entrypoint = "./functions/chat-send/index.ts"

[functions.emissor-worker]
enabled = true
# Disparada pelo pg_cron via system_http_post (sem JWT), igual ao ai-agent-worker. So drena a fila
# outbound_messages, que apenas service_role popula.
verify_jwt = false
entrypoint = "./functions/emissor-worker/index.ts"

[functions.ai-agent]
enabled = true
# ⚠️ ENTRADA DO AGENTE. Chamada pelo wa-inbound, que manda SO o x-hub-secret, sem Authorization.
# O valor real em produção é false (conferido pela API de gestão em 30/07); estava FORA deste
# arquivo, então um deploy pelo CLI ligaria o JWT (default true) e nenhum turno de paciente
# chegaria ao agente, sem erro visível. Mesmo motivo do wa-inbound e do ai-agent-worker.
verify_jwt = false
entrypoint = "./functions/ai-agent/index.ts"

[functions.ai-agent-worker]
enabled = true
# ⚠️ O CEREBRO DO AGENTE. Disparado pelo pg_cron via system_http_post e "cutucado" pelo ai-agent,
# nenhum dos dois manda JWT. O valor real em produção é false; estava FORA deste arquivo, então um
# deploy pelo CLI ligaria o JWT (default true) e o agente pararia de responder paciente, sem erro
# visível. Registrado em 28/07 junto com o wa-inbound, pelo mesmo motivo.
verify_jwt = false
entrypoint = "./functions/ai-agent-worker/index.ts"

[functions.ai-assistant]
enabled = true
# Chamada pelo frontend com o JWT do usuário; a função ainda deriva o clinic_id do token (não do
# corpo) e consulta com papel read-only. Produção já roda true — fixado aqui para não regredir.
verify_jwt = true
entrypoint = "./functions/ai-assistant/index.ts"

[functions.wa-inbound]
enabled = true
# ⚠️ RECEPÇÃO DE TODAS AS 34 CLÍNICAS. Recebe webhook da uazapi, que NÃO manda JWT nenhum.
# O valor real em produção é false; estava FORA deste arquivo, então um deploy pelo CLI ligaria o
# JWT (default true) e a uazapi passaria a levar 401: nenhuma mensagem de paciente entraria, sem
# erro visível de nosso lado. Registrado aqui em 28/07 para desarmar isso de vez.
verify_jwt = false
entrypoint = "./functions/wa-inbound/index.ts"

[functions.ai-sandbox]
enabled = true
# Chamada pelo frontend (Super Admin) com o JWT do usuario; a funcao valida is_super_admin por dentro.
verify_jwt = true
entrypoint = "./functions/ai-sandbox/index.ts"

[functions.ai-bench]
enabled = true
# Bancada de modelos. O valor real em produção é true (conferido pela API de gestão em 10/08/2026);
# estava FORA deste arquivo, e foi declarado aqui em 10/08.
# ⚠️ verify_jwt = true NÃO é a proteção desta função, e por um tempo esta linha deu a entender que
# era: até 10/08/2026 a função não checava NADA por dentro e rodava com service_role, então
# qualquer usuário logado de qualquer clínica conseguia ler lead, conversa e prompt de outro
# cliente e gastar a cota de IA. A trava de verdade é o is_super_admin dentro do index.ts.
verify_jwt = true
entrypoint = "./functions/ai-bench/index.ts"

[functions.whatsapp-orchestrator]
enabled = true
# Máquina de estados da conexão WhatsApp; chamada sem JWT (frontend via whatsapp-bridge/proxy).
# O valor real em produção é false — fixado aqui para um redeploy NÃO ligar o JWT e derrubar a
# conexão de todas as clínicas.
verify_jwt = false
entrypoint = "./functions/whatsapp-orchestrator/index.ts"

[functions.onboarding-rehost-avatars]
enabled = true
# Disparada pelo pg_cron (sem JWT) para re-hospedar avatares efêmeros do WhatsApp.
verify_jwt = false
entrypoint = "./functions/onboarding-rehost-avatars/index.ts"

# ════════════════════════════════════════════════════════════════════════════════════════════
# ⚠️ REGRA DESTE ARQUIVO, e não é burocracia: função que roda com verify_jwt = false em
# produção e NÃO está declarada aqui é uma mina. O CLI usa `true` como default, então o
# primeiro `supabase functions deploy` que a incluir liga o JWT e o chamador (uazapi, site do
# cliente, pg_cron, CRM) passa a levar 401. Não aparece erro do nosso lado: simplesmente para
# de entrar dado. Foi o motivo de registrar wa-inbound e ai-agent-worker em 28/07 e ai-agent em
# 30/07 — e os 15 abaixo estavam na mesma situação, fechados em 30/07/2026 depois de conferir
# o valor real de cada um pela API de gestão (nunca pelo que o arquivo dizia).
#
# Ao criar função nova: declare aqui NO MESMO commit, com o motivo do verify_jwt.
# ════════════════════════════════════════════════════════════════════════════════════════════

[functions.external-forms-ingest]
enabled = true
# ⚠️ CAPTAÇÃO DE LEAD DE FORMULÁRIO. O site do cliente chama com ?k=<token da clínica> e sem
# Authorization. Com JWT ligado, nenhum lead de formulário entra.
verify_jwt = false
entrypoint = "./functions/external-forms-ingest/index.ts"

[functions.site-script]
enabled = true
# ⚠️ Serve o script de rastreamento para TODOS os sites dos clientes, chamado pelo navegador do
# visitante. Com JWT ligado, o rastreamento do site inteiro morre.
verify_jwt = false
entrypoint = "./functions/site-script/index.ts"

[functions.site-tracking]
enabled = true
# Chamada pelo script do site (visitante anônimo) quando a pessoa clica no botão de WhatsApp.
verify_jwt = false
entrypoint = "./functions/site-tracking/index.ts"

[functions.ctwa-tracking]
enabled = true
# Webhook da uazapi (clique em anúncio Click-to-WhatsApp); a uazapi não manda JWT.
verify_jwt = false
entrypoint = "./functions/ctwa-tracking/index.ts"

[functions.ctwa-enrich]
enabled = true
# Disparada pelo pg_cron (sem JWT) para preencher o nome da campanha dos cliques.
verify_jwt = false
entrypoint = "./functions/ctwa-enrich/index.ts"

[functions.uazapi-events]
enabled = true
# Webhook da uazapi (event=connection); a uazapi não manda JWT.
verify_jwt = false
entrypoint = "./functions/uazapi-events/index.ts"

[functions.whatsapp-sync-status]
enabled = true
# Disparada pelo pg_cron (sem JWT) para reconciliar o estado das instâncias.
verify_jwt = false
entrypoint = "./functions/whatsapp-sync-status/index.ts"

[functions.whatsapp-qr-public]
enabled = true
# Página pública de QR code: o cliente abre o link sem estar logado no app.
verify_jwt = false
entrypoint = "./functions/whatsapp-qr-public/index.ts"

[functions.whatsapp-redirect]
enabled = true
# Link de redirecionamento para o WhatsApp, aberto pelo visitante anônimo.
verify_jwt = false
entrypoint = "./functions/whatsapp-redirect/index.ts"

[functions.external-crm-status]
enabled = true
# ENTRADA de Lead/Ganho/Perdido do CRM do cliente (ex.: Clint), autenticada por ?k=<crm_token>.
verify_jwt = false
entrypoint = "./functions/external-crm-status/index.ts"

[functions.meta-capi-conversions]
enabled = true
# Disparada pelo pg_cron / outbox (sem JWT) para enviar conversões à Meta.
verify_jwt = false
entrypoint = "./functions/meta-capi-conversions/index.ts"

[functions.spend-sync-cron]
enabled = true
# Agendador do investimento (Meta + Google), disparado pelo pg_cron sem JWT.
verify_jwt = false
entrypoint = "./functions/spend-sync-cron/index.ts"

[functions.conv-ai-mine]
enabled = true
# Curadoria de padrões do analista mecânico, disparada pelo pg_cron sem JWT.
verify_jwt = false
entrypoint = "./functions/conv-ai-mine/index.ts"

[functions.webhook-proxy]
enabled = true
# Relay navegador -> servidor para contornar CORS nos webhooks da organização.
verify_jwt = false
entrypoint = "./functions/webhook-proxy/index.ts"

[functions.setup-prontuario-password]
enabled = true
# ⚠️ FECHADA EM 03/08/2026 (era false). A função NÃO autentica nada por dentro: lê
# target_user_id, target_email e clinic_id do CORPO da requisição, sobrescreve
# prontuario_passwords com SERVICE_ROLE e manda a senha nova por e-mail PARA O ENDEREÇO QUE VEIO
# NO CORPO. Sem JWT, qualquer pessoa na internet trocava a senha do Prontuário de qualquer
# usuário de qualquer clínica e recebia a senha na própria caixa de entrada. As irmãs
# (setup-prontuario-pin, get-prontuario-pin) sempre foram true: esta ficou para trás.
# Fechada só pela flag, sem republicar código, e nada quebrou: NINGUÉM chama esta função
# (zero no src/, zero em pg_proc, zero em cron.job, zero em system_http_calls). Ela é resto do
# fluxo antigo de senha, substituído pelo de PIN.
# 📌 PENDENTE de decisão do dono: aposentar de vez (a rota certa) ou, se for reativar, ela precisa
# checar QUEM chama (is_super_admin / is_clinic_admin da clínica alvo), porque JWT só prova que a
# pessoa está logada, não que ela pode mexer no prontuário de outra clínica.
verify_jwt = true
entrypoint = "./functions/setup-prontuario-password/index.ts"
